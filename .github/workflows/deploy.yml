name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# No secrets here, ever. The sync token lives only on the phones.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # RETIRED: Pages serves retired/ (a notice page and a kill-switch service worker at the app's
      # old sw.js URL) instead of the app. To bring the app back, revert this step to the old build:
      # e2e tests, npm run build with VITE_FEEDBACK_URL/VITE_TURNSTILE_SITE_KEY, and upload dist.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: retired

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
